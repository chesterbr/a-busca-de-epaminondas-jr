<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Busca de Epaminondas Jr. (original de 1992)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/js-dos.css">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header>
  <div class="titulo"><a href="https://github.com/chesterbr/a-busca-de-epaminondas-jr">A Busca de Epaminondas Jr.</a><span>original de 1992 (DOSBox)</span></div>
  <nav><a href="python.html">Versão Python</a><a href="https://github.com/chesterbr/a-busca-de-epaminondas-jr">Código-fonte no GitHub</a></nav>
</header>
<div id="aviso">Carregando… (o DOSBox no navegador)</div>
<div id="caixa"><div id="jogo"></div></div>
<div class="dica">Depois de GRAVAR no jogo, clique no disquete (canto superior esquerdo) para guardar no navegador.</div>
<script src="https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/js-dos.js"></script>
<script>
try {
  // os emuladores (wasm) vêm do mesmo pacote fixado no jsDelivr; o padrão é o v8.js-dos.com/latest, que muda sozinho
  Dos(document.getElementById('jogo'), { url: 'original.jsdos', autoStart: true, volume: 0,
                                         pathPrefix: 'https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/emulators/' });
  document.getElementById('aviso').remove();
} catch (e) {
  const aviso = document.getElementById('aviso');
  aviso.className = 'erro';
  aviso.textContent = 'Não consegui carregar: ' + e.message;
  console.error(e);
}
</script>
</body>
</html>
